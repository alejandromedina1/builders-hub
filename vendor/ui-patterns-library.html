<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI capabilities to UI patterns</title>
<style>
:root{
  --bg:#ffffff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e6e6eb;--stage:#f5f5f7;
  --ai:#6b4eff;--ai-tint:#efebff;--ok:#1f8f4e;--warn:#b45309;--warn-tint:#fff4e5;--bad:#c62828;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}

/* Shell */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:28px 40px 22px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.legend{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:13px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--ai-tint);box-shadow:inset 0 0 0 1px var(--ai)}
.seg{display:inline-flex;background:var(--stage);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.app{display:grid;grid-template-columns:232px 1fr}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:24px 16px 40px 28px;border-right:1px solid var(--line)}
.rail h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px 10px}
.rail ul{list-style:none;margin:0 0 20px;padding:0}
.rail button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;font-size:14px;text-align:left}
.rail button:hover{background:var(--stage)}
.rail button[aria-current="true"]{background:var(--ink);color:#fff}
.rail button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail button[aria-current="true"] span{color:#c7c7cc}

main{padding:40px 40px 80px;min-width:0}
.cap-name{font-size:44px;line-height:1.05;font-weight:600;letter-spacing:-.025em;margin:0}
.cap-desc{font-size:19px;color:var(--ink);margin:12px 0 4px;max-width:60ch}
.cap-ex{font-size:14px;color:var(--muted);margin:0;max-width:70ch}
.layer{margin-top:44px}
.layer h3{font-size:17px;font-weight:600;margin:0}
.layer > p{font-size:14px;color:var(--muted);margin:2px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:36px 28px}
.empty{font-size:14px;color:var(--muted);padding:18px 0}

.card .stage{height:220px}
.stage{position:relative;background:var(--stage);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage .replay,.stage .try{position:absolute;top:10px;right:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 9px}
.stage .replay:hover{color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px}
.meta .name{font-size:16px;font-weight:600;text-align:left}
.meta .name:hover{text-decoration:underline;text-underline-offset:3px}
.badge{font-size:12px;color:var(--muted);white-space:nowrap}
.card .use{font-size:14px;color:var(--muted);margin:3px 0 0;line-height:1.45}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:28px 32px 48px}
.sheet.on{transform:none}
.sheet .close{position:absolute;top:18px;right:20px;font-size:14px;color:var(--muted)}
.sheet h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:18px 0 2px}
.sheet .stage{height:280px;margin:20px 0 8px}
.sheet dl{margin:24px 0 0}
.sheet dt{font-size:13px;color:var(--muted);margin-top:18px}
.sheet dd{margin:4px 0 0;font-size:15px;line-height:1.5}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.links button:hover{border-color:var(--ink)}

/* Draft */
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.draft-btn{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
body.drafting .rail,body.drafting .seg{display:none}
body.drafting .app{grid-template-columns:1fr}
body.drafting main{max-width:1180px;margin:0 auto;width:100%}
.setup{max-width:620px}
.setup label,.setup .q{display:block;font-size:15px;font-weight:600;margin:32px 0 10px}
.setup .hint{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.setup input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.setup input:focus{outline:2px solid var(--ai);outline-offset:0;border-color:transparent}
.pick-chips{display:flex;flex-wrap:wrap;gap:8px}
.pick-chips button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.pick-chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.go-row{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap}
.go{background:var(--ink);color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:500}
.quiet{border:1px solid var(--line);border-radius:10px;padding:11px 18px;font-size:15px}
.quiet:hover{border-color:var(--ink)}
.go:disabled{opacity:.35;cursor:default}

.dbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -40px;padding:14px 40px 0;border-bottom:1px solid var(--line)}
.dbar-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.dtitle{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0}
.dtitle button{font-size:13px;font-weight:400;color:var(--muted);margin-left:10px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs button{padding:8px 12px 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.tabs span{font-variant-numeric:tabular-nums;margin-left:4px}
.progress{height:3px;background:var(--line);margin:0 -40px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

.rv .stage{transition:box-shadow .2s}
.rv[data-pick="use"] .stage{box-shadow:0 0 0 2px var(--ink)}
.rv[data-pick="skip"]{opacity:.42}
.rv[data-pick="skip"]:hover{opacity:.8}
.decide{display:flex;gap:8px;margin-top:12px}
.decide button{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.decide button:hover{border-color:#b9b9c0}
.decide .pick-use[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.decide .pick-skip[aria-pressed="true"]{background:var(--stage);border-color:var(--stage);color:var(--muted)}
.sheet .decide{max-width:320px;margin-top:16px}

.sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.sum-actions{display:flex;gap:8px;flex-wrap:wrap}
.sum-actions button{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px}
.sum-actions button:hover{border-color:var(--ink)}
.sum-actions .go{border-color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin:28px 0 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:4px 0 0;font-size:15px}
.checks{margin-top:36px;background:var(--warn-tint);border-radius:16px;padding:18px 22px}
.checks h3{font-size:15px;margin:0 0 8px}
.checks ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.checks button{text-decoration:underline;text-underline-offset:3px}
.srow{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid var(--line);align-items:start}
.srow .stage{height:190px}
.srow h4{font-size:18px;font-weight:600;margin:0}
.srow .badge{display:block;margin-top:2px}
.srow dl{margin:12px 0 0;font-size:14px;line-height:1.5}
.srow dt{color:var(--muted);font-size:13px;margin-top:10px}
.srow dd{margin:2px 0 0}
.srow .remove{font-size:13px;color:var(--muted);margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.disc{margin-top:36px;font-size:14px;color:var(--muted)}
.disc summary{cursor:pointer;color:var(--ink);font-weight:600}
.disc p{margin:8px 0 0}
.tabs[hidden]{display:none}
.vseg{display:inline-flex;background:var(--stage);border-radius:10px;padding:3px}
.vseg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.deck{max-width:560px;margin:32px auto 0}
.deck-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.dcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.06);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcard.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.dcard .stage{height:300px;user-select:text;-webkit-user-select:text}
.dinfo{padding:18px 8px 6px;cursor:grab}
.dinfo:active{cursor:grabbing}
.dinfo .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dinfo h2{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.dinfo dl{margin:6px 0 0;font-size:14px;line-height:1.5}
.dinfo dt{font-size:13px;color:var(--muted);margin-top:12px}
.dinfo dd{margin:2px 0 0}
.dinfo .pairs button{text-decoration:underline;text-underline-offset:3px}
.dinfo .pairs em{font-style:normal;color:var(--muted)}
.stamp{position:absolute;top:24px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;z-index:2}
.stamp.s-use{right:24px;background:var(--ink);color:#fff}
.stamp.s-skip{left:24px;background:#fff;color:var(--muted);border:1px solid var(--line)}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.deck-actions button{padding:14px;border-radius:14px;font-size:16px;font-weight:500;border:1px solid var(--line)}
.deck-actions .dk-skip:hover{border-color:#b9b9c0}
.deck-actions .dk-use{background:var(--ink);color:#fff;border-color:var(--ink)}
.deck-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.deck-foot button{text-decoration:underline;text-underline-offset:3px}
.deck-foot button:disabled{opacity:.35;text-decoration:none;cursor:default}
.deck-done{text-align:center;padding:56px 24px;background:var(--stage);border-radius:22px}
.deck-done h2{font-size:26px;font-weight:600;letter-spacing:-.015em;margin:0}
.deck-done p{color:var(--muted);margin:8px 0 24px}
.deck-done .go-row{justify-content:center;margin-top:0}
.confirm-row{display:inline-flex;gap:6px;align-items:center;font-size:14px}
@media (max-width:760px){.dcard .stage{height:240px}.deck-foot .keys{display:none}}
.saved-btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.saved-btn:hover{border-color:var(--ink)}
.save-btn.done{color:var(--ok);border-color:var(--line)}
.slist{margin-top:32px;border-top:1px solid var(--line)}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sitem h3{font-size:18px;font-weight:600;margin:0}
.sitem h3 small{font-size:12px;font-weight:500;color:var(--ai);background:var(--ai-tint);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.sitem p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.sitem .acts button{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.sitem .acts button:hover{border-color:var(--ink)}
.sitem .acts .go{border-color:var(--ink)}
.guard{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--warn-tint);border-radius:12px;padding:10px 12px}
.guard button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.guard .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.snap *{animation:none!important;transition:none!important}
.snap .replay,.snap .try{display:none!important}
.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
@media (max-width:760px){
  .dbar{margin:0 -20px;padding:12px 20px 0}.progress{margin:0 -20px}
  .srow{grid-template-columns:1fr}
}
@media print{
  .top,.rail,.sum-actions,.srow .remove,.scrim,.sheet{display:none!important}
  main{padding:0}.srow{break-inside:avoid}.checks{background:none;border:1px solid #ccc}
}

@media (max-width:760px){
  .top{padding:20px}
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 20px}
  .rail h2{display:none}
  .rail ul{display:flex;gap:6px;overflow-x:auto;margin:0}
  .rail ul + h2 + ul{margin-top:6px}
  .rail button{white-space:nowrap;gap:8px}
  main{padding:28px 20px 60px}
  .cap-name{font-size:34px}
}

/* Demo vocabulary */
.d{width:100%;max-width:300px;font-size:13px;line-height:1.4}
.col{display:flex;flex-direction:column;gap:8px}
.bub{padding:8px 11px;border-radius:14px;max-width:88%}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--ai-tint);border-bottom-left-radius:4px}
.ai-box{background:var(--ai-tint);border-radius:10px;padding:10px 12px}
.caret{display:inline-block;width:6px;height:13px;background:var(--ai);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.mini,.chip,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.chip{padding:5px 11px}
.chip:hover,.mini:hover,.btn:hover{border-color:#b9b9c0}
.btn{border-radius:8px;padding:6px 12px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:36px}
.ph{color:#a1a1a6}
.sk{height:7px;border-radius:4px;background:#e2e2e8}
.lbl{font-size:11px;color:var(--muted)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ghost{color:var(--ai);opacity:.55}
.accepted{background:var(--ai-tint);border-radius:3px}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}
.tint{background:var(--ai-tint);border-radius:3px;padding:0 2px}
.sel{background:#cfe0ff;border-radius:2px}
.panel{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.check{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>AI capabilities to UI patterns</h1>
    <p>Pick what the AI does. See the patterns that bring it to the interface.<span class="legend"><i></i>AI-produced content</span></p>
  </div>
  <div class="top-actions">
  <div class="seg" role="group" aria-label="Surface">
    <button data-s="all" aria-pressed="true">All surfaces</button>
    <button data-s="chat" aria-pressed="false">Chat</button>
    <button data-s="embedded" aria-pressed="false">Embedded in product</button>
  </div>
  <button class="saved-btn" id="savedBtn" hidden>Saved drafts</button>
  <button class="draft-btn" id="draftBtn">Start a draft</button>
  </div>
</header>

<div class="app">
  <nav class="rail" aria-label="Capabilities">
    <h2>Browse</h2>
    <ul id="railAll"></ul>
    <h2>What the AI does</h2>
    <ul id="railCaps"></ul>
  </nav>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></aside>

<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let FAST = false; // set while taking PDF screenshots so demos jump to their final state
const wait = ms => new Promise(r => setTimeout(r, (RM||FAST) ? 0 : ms));
async function type(el, text, root, speed = 26){
  for (const ch of text){ if (!root.isConnected) return false; el.textContent += ch; await wait(speed); }
  return root.isConnected;
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- Capabilities ---------- */
const CAPS = [
  {id:'gen',  name:'Generate',          desc:'Create new text, images or code from a prompt.', ex:'Draft an email, write product copy, produce a first version of a design.'},
  {id:'sum',  name:'Summarize',         desc:'Condense long content into what matters.', ex:'Meeting recaps, thread digests, document overviews.'},
  {id:'rew',  name:'Rewrite & translate', desc:'Change the tone, length, language or format of existing content.', ex:'Shorten a paragraph, make a message friendlier, translate a comment.'},
  {id:'cls',  name:'Classify & tag',    desc:'Sort, label and route items automatically.', ex:'Inbox triage, ticket routing, content moderation.'},
  {id:'ext',  name:'Extract',           desc:'Pull structured data out of documents, images and messages.', ex:'Receipt scanning, contract fields, lead details from an email.'},
  {id:'srch', name:'Search & answer',   desc:'Find information by meaning and answer questions about it.', ex:'Help centers, internal knowledge bases, product search.'},
  {id:'rec',  name:'Recommend',         desc:'Suggest the next best item or action for each person.', ex:'Content feeds, related items, next steps in a workflow.'},
  {id:'pred', name:'Predict & detect',  desc:'Forecast trends and flag what looks unusual.', ex:'Churn risk, anomaly alerts, demand forecasts.'},
  {id:'conv', name:'Converse',          desc:'Hold a back-and-forth dialogue to help someone get something done.', ex:'Support assistants, onboarding guides, in-app copilots.'},
  {id:'act',  name:'Act on your behalf', desc:'Plan and carry out multi-step tasks across tools.', ex:'Send follow-ups, book meetings, update records in bulk.'},
  {id:'see',  name:'See',               desc:'Recognize objects, text and scenes in images and video.', ex:'Visual search, damage inspection, alt text, document scanning.'},
  {id:'hear', name:'Hear & speak',      desc:'Turn speech into text and text into speech.', ex:'Dictation, call transcripts, voice commands, read-aloud.'},
];

/* ---------- Patterns ---------- */
const P = [
 {id:'stream', name:'Streaming response', s:'both', layer:'core', caps:['gen','sum','conv'],
  use:'Output takes more than a second to finish, so people see progress right away.',
  avoid:'The output is short, or it has to be validated as a whole before anyone sees it (like structured data).',
  pairs:['regen','feedback']},
 {id:'starters', name:'Starter prompts', s:'chat', layer:'core', caps:['gen','conv','srch'],
  use:'An open-ended input is empty and people don\'t know what to ask.',
  avoid:'The task is narrow and the input already explains itself.',
  pairs:['clarify','copilot']},
 {id:'ghost', name:'Inline suggestion', s:'embedded', layer:'core', caps:['gen','rew'],
  use:'People write in context and the next words are predictable.',
  avoid:'Suggestions are long or often wrong. They break the writer\'s flow.',
  pairs:['undo','selbar']},
 {id:'selbar', name:'Selection actions', s:'embedded', layer:'core', caps:['rew','sum','gen'],
  use:'People want to act on one specific part of existing content.',
  avoid:'Content isn\'t editable, or most use happens on touch where selecting text is awkward.',
  pairs:['diff','variants']},
 {id:'variants', name:'Multiple options', s:'both', layer:'core', caps:['gen','rew','rec'],
  use:'Taste matters or each option has real trade-offs, and there is no single right answer.',
  avoid:'Comparing options costs more effort than editing one good draft.',
  pairs:['feedback','regen']},
 {id:'mixin', name:'Mixed input', s:'both', layer:'core', caps:['conv','see','hear','srch','gen'],
  use:'People need to give the AI more than text: a file, an image, their voice or something already on screen.',
  avoid:'The task only ever needs one kind of input. Extra controls just add clutter.',
  pairs:['starters','voice']},
 {id:'tldr', name:'Summary card', s:'embedded', layer:'core', caps:['sum'],

/* ---------- Rendering ---------- */
const state = { cap:'gen', surface:'all', mode:'browse' };
function readHash(){ const h=new URLSearchParams(location.hash.slice(1)); if(h.get('cap')) state.cap=h.get('cap'); if(h.get('surface')) state.surface=h.get('surface'); }
function writeHash(){ history.replaceState(null,'',`#cap=${state.cap}&surface=${state.surface}`); }

const fits = p => state.surface==='all' || p.s===state.surface || p.s==='both';
const patternsFor = cap => P.filter(p => (cap==='all' || p.caps.includes(cap)) && fits(p));

function mountDemo(stage, id){
  const demo = D[id]; stage.innerHTML='';
  const box=document.createElement('div'); box.style.cssText='width:100%;display:flex;justify-content:center';
  box.innerHTML=demo.html; stage.append(box);
  demo.init && demo.init(box);
  if(demo.run){
    const b=document.createElement('button'); b.className='replay'; b.textContent='Replay'; b.setAttribute('aria-label','Replay demo');
    b.onclick=e=>{e.stopPropagation(); mountDemo(stage,id); startDemo(stage,id);}; stage.append(b);
  } else if(demo.try){
    const t=document.createElement('span'); t.className='try'; t.textContent='Try it'; stage.append(t);
  }
  stage._box=box;
}
function startDemo(stage,id){ const d=D[id]; if(d.run && stage._box && !stage._started){ stage._started=true; d.run(stage._box); } }

const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ startDemo(e.target,e.target.dataset.id); io.unobserve(e.target);} }),{threshold:.5});

function card(p){
  const el=document.createElement('article'); el.className='card';
  el.innerHTML=`<div class="stage" data-id="${p.id}"></div>
    <div class="meta"><button class="name">${p.name}</button><span class="badge">${SURF[p.s]}</span></div>
    <p class="use">${p.use}</p>`;
  const st=$('.stage',el); mountDemo(st,p.id); io.observe(st);
  $('.name',el).onclick=()=>openSheet(p.id);
  return el;
}

function renderRail(){
  const item=(id,name)=>`<li><button data-cap="${id}" aria-current="${state.cap===id}">${name}<span>${patternsFor(id).length}</span></button></li>`;
  $('#railAll').innerHTML=item('all','All patterns');
  $('#railCaps').innerHTML=CAPS.map(c=>item(c.id,c.name)).join('');
  $$('.rail [data-cap]').forEach(b=>b.onclick=()=>{ state.cap=b.dataset.cap; render(); window.scrollTo({top:0}); });
}

function renderMain(){
  const cap = CAPS.find(c=>c.id===state.cap) || {name:'All patterns', desc:'Every pattern in the hub, across all capabilities.', ex:'Use the list on the left to see only the patterns for one capability.'};
  const list = patternsFor(state.cap);
  const m=$('#main'); m.innerHTML=`<h1 class="cap-name">${cap.name}</h1><p class="cap-desc">${cap.desc}</p><p class="cap-ex">Typical features: ${cap.ex}</p>`;
  [['core','Core interaction','How people trigger the AI and receive what it produces.'],['trust','Trust and control','How people check, steer and recover from what the AI did.']].forEach(([k,h,d])=>{
    const sec=document.createElement('section'); sec.className='layer';
    sec.innerHTML=`<h3>${h}</h3><p>${d}</p>`;
    const items=list.filter(p=>p.layer===k);
    if(!items.length){ sec.insertAdjacentHTML('beforeend',`<div class="empty">No ${k==='core'?'core':'trust'} patterns for this capability on this surface. Switch to All surfaces to see the rest.</div>`); }
    else { const g=document.createElement('div'); g.className='grid'; items.forEach(p=>g.append(card(p))); sec.append(g); }
    m.append(sec);
  });
}

function render(){
  const drafting = state.mode!=='browse';
  document.body.classList.toggle('drafting', drafting);
  const decided = Object.keys(draft.picks).length;
  $('#draftBtn').textContent = drafting ? 'Back to library' : (draft.started ? `Continue draft (${decided} of ${P.length})` : 'Start a draft');
  if(state.mode==='setup') return renderSetup();
  if(state.mode==='review') return renderReview();
  const sb=$('#savedBtn'); sb.hidden = !saved.length || state.mode==='saved'; sb.textContent=`Saved drafts (${saved.length})`;
  if(state.mode==='summary') return renderSummary();
  if(state.mode==='saved') return renderSaved();
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===state.surface)); renderRail(); renderMain(); writeHash();
}

/* ---------- Draft ---------- */
const draft = { id:null, name:'', caps:new Set(), surface:'all', picks:{}, filter:'all', started:false, view:'grid', history:[], snap:null };

/* ---------- Saved drafts ---------- */
let saved = [];            // [{id,name,caps,surface,picks,history,updatedAt}]
const STORE_KEY='ai-pattern-drafts';
const hasStore = () => !!(window.storage && window.storage.get);
const snapOf = d => JSON.stringify({name:d.name,caps:[...d.caps].sort(),surface:d.surface,picks:d.picks});
const hasContent = () => draft.name.trim() || draft.caps.size || Object.keys(draft.picks).length;
const isDirty = () => hasContent() && snapOf(draft)!==draft.snap;

async function loadSaved(){
  if(!hasStore()) return;
  try{ const r=await window.storage.get(STORE_KEY,false); if(r && r.value) saved=JSON.parse(r.value)||[]; }catch(e){ /* nothing saved yet */ }
  render();
}
async function persist(){
  if(!hasStore()) return false;
  try{ const r=await window.storage.set(STORE_KEY,JSON.stringify(saved),false); return !!r; }catch(e){ return false; }
}
async function saveDraft(){
  const now=Date.now();
  if(!draft.id) draft.id=now.toString(36)+Math.random().toString(36).slice(2,6);
  const rec={id:draft.id,name:draft.name.trim()||'Untitled draft',caps:[...draft.caps],surface:draft.surface,picks:{...draft.picks},history:[...draft.history],updatedAt:now};
  const i=saved.findIndex(x=>x.id===draft.id); const prev=saved.slice();
  if(i>=0) saved[i]=rec; else saved.unshift(rec);
  const ok=await persist();
  if(!ok && hasStore()){ saved=prev; return 'error'; }
  draft.snap=snapOf(draft);
  return ok?'ok':'session';
}
function resetDraft(){ Object.assign(draft,{id:null,name:'',caps:new Set(),surface:'all',picks:{},filter:'all',started:false,history:[],snap:null}); }
function loadDraft(rec){
  Object.assign(draft,{id:rec.id,name:rec.name==='Untitled draft'?'':rec.name,caps:new Set(rec.caps),surface:rec.surface,picks:{...rec.picks},history:[...(rec.history||[])],filter:'all',started:true});
  draft.snap=snapOf(draft);
}
/* Ask before replacing unsaved work. host = element to swap for the prompt; proceed = what to do after. */
function guardUnsaved(host, proceed, back){
  if(!isDirty()) return proceed();
  const g=document.createElement('div'); g.className='guard fade';
  g.innerHTML=`<span>“${esc(draft.name||'Untitled draft')}” has unsaved changes.</span><button class="go">Save it first</button><button class="dis">Don't save</button><button class="cn">Cancel</button>`;
  host.replaceWith(g);
  $('.go',g).onclick=async()=>{ const r=await saveDraft(); if(r==='error'){ flash('Couldn\'t save. Try again.'); return back(); } proceed(); };
  $('.dis',g).onclick=proceed; $('.cn',g).onclick=back;
}
function newDraft(){ resetDraft(); go('setup'); }
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

function renderSaved(){
  const m=$('#main');
  m.innerHTML=`<div class="sum-head"><div><h1 class="cap-name">Saved drafts</h1>
    <p class="cap-desc">Open a draft to keep reviewing or see its summary.</p>
    ${hasStore()?'':'<p class="cap-ex">Drafts are kept only while this page is open.</p>'}</div>
    <div class="sum-actions"><button class="go" id="snew">Start a new draft</button></div></div>
    <div class="slist" id="slist"></div>`;
  const list=$('#slist');
  if(!saved.length){ list.innerHTML='<div class="empty" style="padding:40px 0;font-size:16px">No saved drafts yet. Finish a draft and choose Save draft on its summary.</div>'; }
  saved.forEach(rec=>{
    const v=Object.values(rec.picks), use=v.filter(x=>x==='use').length, skip=v.length-use, todo=P.length-v.length;
    const caps=rec.caps.length?rec.caps.map(capName).join(', ')+'. ':'';
    const el=document.createElement('div'); el.className='sitem';
    el.innerHTML=`<div><h3>${esc(rec.name)}${draft.id===rec.id?'<small>Open now</small>':''}</h3>

    $('.o-sum',el).onclick=()=>open('summary');

}

function wireUndo(root){ const u=$('.dk-undo',root); if(u) u.onclick=()=>{ const id=draft.history.pop(); if(!id) return; delete draft.picks[id]; refreshDeckChrome(); renderDeck(); }; }

let deckBusy=false;
async function deckDecide(val){
  const card=$('.dcard'); if(!card || deckBusy) return; deckBusy=true;
  const id=card.dataset.pid; draft.picks[id]=val; draft.history.push(id);
  card.classList.remove('fade'); card.classList.add('anim');
  $(`.stamp.s-${val}`,card).style.opacity=1;
  const dir=val==='use'?1:-1;
  card.style.transform=`translateX(${dir*120}%) rotate(${dir*8}deg)`; card.style.opacity=0;
  await wait(280); deckBusy=false; refreshDeckChrome(); renderDeck();
}

function wireDrag(card){
  if(!card) return; let x0=null, dx=0;
  const su=$('.s-use',card), sk=$('.s-skip',card);
  card.addEventListener('pointerdown',e=>{ if(e.target.closest('.stage,button,a') || e.button!==0) return; x0=e.clientX; dx=0; card.setPointerCapture(e.pointerId); card.classList.remove('anim','fade'); });
  card.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`; su.style.opacity=Math.max(0,Math.min(1,dx/110)); sk.style.opacity=Math.max(0,Math.min(1,-dx/110)); });
  const end=()=>{ if(x0===null) return; x0=null;
    if(Math.abs(dx)>110) return deckDecide(dx>0?'use':'skip');
    card.classList.add('anim'); card.style.transform=''; su.style.opacity=0; sk.style.opacity=0; };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}

document.addEventListener('keydown',e=>{

});

function summaryChecks(chosen){
  const ids=new Set(chosen.map(p=>p.id)), out=[];
  if(!chosen.length) return ['No patterns selected yet.'];
  if(!chosen.some(p=>p.layer==='trust')) out.push('No trust and control patterns selected. People will have no way to check, steer or undo what the AI does.');
  draft.caps.forEach(c=>{ if(!chosen.some(p=>p.caps.includes(c))) out.push(`Nothing selected yet for ${esc(capName(c))}.`); });
  chosen.forEach(p=>{
    const missing=p.pairs.filter(x=>!ids.has(x) && draft.picks[x]!=='skip');
    if(missing.length) out.push(`${esc(p.name)} usually pairs with ${missing.map(x=>`<button data-open="${x}">${esc(byId[x].name)}</button>`).join(' and ')}.`);
  });
  if(draft.surface!=='all') chosen.filter(p=>!draftFits(p)).forEach(p=>out.push(`${esc(p.name)} is a ${SURF[p.s].toLowerCase()} pattern, but this feature lives ${draft.surface==='chat'?'in a chat':'embedded in the product'}.`));
  const todo=counts().todo; if(todo) out.push(`${todo} pattern${todo>1?'s':''} still to review.`);
  return out;
}

function summaryText(chosen){
  const L=[`AI feature draft: ${draft.name||'Untitled draft'}`];
  if(draft.caps.size) L.push(`What the AI does: ${[...draft.caps].map(capName).join(', ')}`);
  L.push(`Where it lives: ${SURF_DRAFT[draft.surface]}`,'');
  [['core','Core interaction'],['trust','Trust and control']].forEach(([k,h])=>{
    const g=chosen.filter(p=>p.layer===k); if(!g.length) return;
    L.push(h); g.forEach(p=>L.push(`- ${p.name} (${SURF[p.s]}). Use it when: ${p.use} Avoid it when: ${p.avoid}`)); L.push('');
  });
  const checks=summaryChecks(chosen).map(t=>t.replace(/<[^>]+>/g,''));
  if(checks.length){ L.push('Things to look at'); checks.forEach(t=>L.push(`- ${t}`)); L.push(''); }
  const disc=P.filter(p=>draft.picks[p.id]==='skip'); if(disc.length) L.push(`Discarded: ${disc.map(p=>p.name).join(', ')}`);
  return L.join('\n').trim();
}

const scriptCache={};
function loadScript(src,ready){
  if(ready()) return Promise.resolve(ready());
  if(!scriptCache[src]) scriptCache[src]=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=src;
    sc.onload=()=>ready()?res(ready()):rej(); sc.onerror=()=>{ delete scriptCache[src]; rej(); }; document.head.append(sc);
  });
  return scriptCache[src];
}
const loadH2C=()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);

// Show the most telling moment of interactive demos in the screenshot.
const SNAP = {
  selbar: r=>$('[data-v]',r).click(),
  variants: r=>$('.opt',r).click(),
  cite: r=>$('.c',r).click(),
  translate: r=>$('.tg',r).click(),
  why: r=>$('.w',r).click(),
  readaloud: r=>{ r._show(6); $('.pp',r).textContent='❚❚'; },
};
// SVG attributes can't resolve CSS variables once html2canvas turns them into images.
const VARS={'--ink':'#1d1d1f','--muted':'#6e6e73','--line':'#e6e6eb','--stage':'#f5f5f7','--ai':'#6b4eff','--ai-tint':'#efebff','--ok':'#1f8f4e','--warn':'#b45309'};
function fixSvgVars(doc){
  doc.querySelectorAll('svg *').forEach(n=>['fill','stroke'].forEach(a=>{
    const v=n.getAttribute(a); if(v && v.includes('var(')) n.setAttribute(a, v.replace(/var\((--[\w-]+)\)/g,(m,k)=>VARS[k]||'#000'));
  }));
}
async function snapshotDemos(ids,onProgress){
  const h2c=await loadH2C(), out={};
  const host=document.createElement('div'); host.className='snap';
  host.style.cssText='position:absolute;left:0;top:0;z-index:-1;pointer-events:none;';
  document.body.append(host); FAST=true;
  try{
    for(let i=0;i<ids.length;i++){
      const id=ids[i]; onProgress&&onProgress(i+1,ids.length);
      const st=document.createElement('div'); st.className='stage'; st.style.cssText='width:520px;height:280px;';
      host.innerHTML=''; host.append(st);
      mountDemo(st,id);
      const box=st._box;
      try{ if(D[id].run) await D[id].run(box); if(SNAP[id]) SNAP[id](box); }catch(e){}
      await new Promise(r=>setTimeout(r,80));
      try{
        const c=await h2c(st,{scale:2,backgroundColor:'#ffffff',logging:false,onclone:fixSvgVars});
        out[id]=c.toDataURL('image/jpeg',0.9);
      }catch(e){ /* skip this one, the PDF still gets its text */ }
    }
  } finally { FAST=false; host.remove(); }
  return out;
}

let jsPDFLoader=null;
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if(!jsPDFLoader) jsPDFLoader=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(); sc.onerror=()=>{jsPDFLoader=null;rej();}; document.head.append(sc);
  });
  return jsPDFLoader;
}

async function buildPDF(chosen,images={}){
  const JsPDF=await loadJsPDF();
  const doc=new JsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=56, CW=W-M*2;
  const INK=[29,29,31], MUTED=[110,110,115], LINE=[230,230,235], AI=[107,78,255], WARN=[255,244,229];
  let y=M;
  const font=(size,style='normal',color=INK)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); doc.setTextColor(...color); };
  const lh=size=>size*1.4;
  const room=h=>{ if(y+h>H-M){ doc.addPage(); y=M; } };
  const text=(t,size,style,color,x=M,width=CW)=>{ font(size,style,color); const lines=doc.splitTextToSize(String(t),width); lines.forEach(l=>{ room(lh(size)); doc.text(l,x,y+size); y+=lh(size); }); };
  const plain=t=>t.replace(/<[^>]+>/g,'');

  // Header
  font(10,'normal',AI); doc.text('AI feature draft',M,y+10); y+=22;
  text(draft.name||'Untitled draft',26,'bold');
  y+=2; text(`${chosen.length} pattern${chosen.length===1?'':'s'} selected for this feature.`,12,'normal',MUTED);
  y+=14;

  // Facts
  const facts=[['What the AI does',draft.caps.size?[...draft.caps].map(capName).join(', '):'Not set'],['Where it lives',SURF_DRAFT[draft.surface]],
    ['Core interaction',`${chosen.filter(p=>p.layer==='core').length} selected`],['Trust and control',`${chosen.filter(p=>p.layer==='trust').length} selected`]];
  doc.setDrawColor(...LINE); doc.setLineWidth(.75); doc.line(M,y,W-M,y); y+=14;
  const colW=CW/4; let maxH=0;
  facts.forEach(([k,v],i)=>{ const x=M+i*colW; font(9,'normal',MUTED); doc.text(k,x,y+9);
    font(10.5); const ls=doc.splitTextToSize(v,colW-12); ls.forEach((l,j)=>doc.text(l,x,y+26+j*lh(10.5))); maxH=Math.max(maxH,26+ls.length*lh(10.5)); });
  y+=maxH+6; doc.line(M,y,W-M,y); y+=24;

  // Things to look at
  const checks=summaryChecks(chosen).map(plain);
  if(checks.length){
    font(10.5); const pad=14, items=checks.map(c=>doc.splitTextToSize(c,CW-pad*2-12));
    const boxH=pad*2+18+items.reduce((a,l)=>a+l.length*lh(10.5)+3,0);
    room(Math.min(boxH,H-M*2));
    doc.setFillColor(...WARN); doc.roundedRect(M,y,CW,boxH,10,10,'F');
    let iy=y+pad; font(11,'bold'); doc.text('Things to look at',M+pad,iy+11); iy+=22;
    font(10.5); items.forEach(ls=>{ doc.text('•',M+pad,iy+10.5); ls.forEach(l=>{ doc.text(l,M+pad+12,iy+10.5); iy+=lh(10.5); }); iy+=3; });
    y+=boxH+28;
  }

  // Patterns
  [['core','Core interaction','How people trigger the AI and receive what it produces.'],['trust','Trust and control','How people check, steer and recover from what the AI did.']].forEach(([k,h,d])=>{
    const g=chosen.filter(p=>p.layer===k); if(!g.length) return;
    room(80); text(h,15,'bold'); text(d,10,'normal',MUTED); y+=10;
    g.forEach(p=>{
      const img=images[p.id], IW=img?210:0, IH=img?IW*280/520:0, GAP=img?20:0, TX=M+12+IW+GAP, TW=CW-12-IW-GAP;
      const fields=[['Use it when',p.use],['Avoid it when',p.avoid],['Serves',p.caps.map(capName).join(', ')]];
      font(10.5); const fh=fields.reduce((a,[,v])=>a+lh(9)+doc.splitTextToSize(v,TW).length*lh(10.5)+4,0);
      room(24+Math.max(IH,fh)+24);
      doc.setFillColor(...AI); doc.rect(M,y+2,3,14,'F');
      font(13,'bold'); doc.text(p.name,M+12,y+13);
      font(9.5,'normal',MUTED); doc.text(SURF[p.s],W-M,y+13,{align:'right'}); y+=26;
      const y0=y;
      if(img){ doc.addImage(img,'JPEG',M+12,y0,IW,IH); }
      fields.forEach(([l,v])=>{ text(l,9,'normal',MUTED,TX,TW); text(v,10.5,'normal',INK,TX,TW); y+=4; });
      y=Math.max(y,y0+IH);
      y+=12; doc.setDrawColor(...LINE); doc.line(M,y,W-M,y); y+=16;
    });
    y+=10;
  });
  if(!chosen.length){ text('No patterns selected yet.',11,'normal',MUTED); }

  // Discarded
  const disc=P.filter(p=>draft.picks[p.id]==='skip');
  if(disc.length){ room(50); text(`Discarded (${disc.length})`,11,'bold'); text(disc.map(p=>p.name).join(', '),10,'normal',MUTED); }

  // Footer
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); font(8.5,'normal',MUTED);
    doc.text(draft.name||'Untitled draft',M,H-28); doc.text(`Page ${i} of ${n}`,W-M,H-28,{align:'right'}); }
  return doc;
}

function renderSummary(){
  const chosen=P.filter(p=>draft.picks[p.id]==='use'), disc=P.filter(p=>draft.picks[p.id]==='skip'), m=$('#main');
  const checks=summaryChecks(chosen);
  m.innerHTML=`<div class="sum-head"><div><h1 class="cap-name">${esc(draft.name||'Untitled draft')}</h1>
    <p class="cap-desc">${chosen.length} pattern${chosen.length===1?'':'s'} selected for this feature.</p></div>
    <div class="sum-actions"><button id="sback">Keep reviewing</button><button id="scopy">Copy as text</button><button id="spdf">Download PDF</button><button id="sreset">New draft</button><button class="go save-btn" id="ssave"></button></div></div>
    <p class="cap-ex" id="pdfnote" aria-live="polite" style="margin-top:8px"></p>
    <dl class="facts">
      <div><dt>What the AI does</dt><dd>${draft.caps.size?[...draft.caps].map(c=>esc(capName(c))).join(', '):'Not set'}</dd></div>
      <div><dt>Where it lives</dt><dd>${SURF_DRAFT[draft.surface]}</dd></div>
      <div><dt>Core interaction</dt><dd>${chosen.filter(p=>p.layer==='core').length} selected</dd></div>
      <div><dt>Trust and control</dt><dd>${chosen.filter(p=>p.layer==='trust').length} selected</dd></div>
    </dl>
    ${checks.length?`<div class="checks"><h3>Things to look at</h3><ul>${checks.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
    <div id="sbody"></div>
    ${disc.length?`<details class="disc"><summary>Discarded (${disc.length})</summary><p>${disc.map(p=>esc(p.name)).join(', ')}</p></details>`:''}`;
  const body=$('#sbody');
  [['core','Core interaction','How people trigger the AI and receive what it produces.'],['trust','Trust and control','How people check, steer and recover from what the AI did.']].forEach(([k,h,d])=>{
    const g=chosen.filter(p=>p.layer===k); if(!g.length) return;
    const sec=document.createElement('section'); sec.className='layer'; sec.innerHTML=`<h3>${h}</h3><p style="margin-bottom:0">${d}</p>`;
    g.forEach(p=>{
      const r=document.createElement('div'); r.className='srow';
      r.innerHTML=`<div class="stage" data-id="${p.id}"></div><div><h4>${p.name}</h4><span class="badge">${SURF[p.s]}</span>
        <dl><dt>Use it when</dt><dd>${p.use}</dd><dt>Avoid it when</dt><dd>${p.avoid}</dd>
        <dt>Serves</dt><dd>${p.caps.map(capName).join(', ')}</dd></dl>
        <button class="remove">Remove from selection</button></div>`;
      const st=$('.stage',r); mountDemo(st,p.id); io.observe(st);
      $('.remove',r).onclick=()=>{ delete draft.picks[p.id]; draft.history=draft.history.filter(x=>x!==p.id); renderSummary(); };
      sec.append(r);
    });
    body.append(sec);
  });
  $$('[data-open]',m).forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
  $('#sback').onclick=()=>go('review');
  $('#spdf').onclick=async()=>{
    const b=$('#spdf'), note=$('#pdfnote'); b.disabled=true; b.textContent='Preparing PDF…'; note.textContent='';
    try{
      let images={}, shotsFailed=false;
      if(chosen.length){
        try{ images=await snapshotDemos(chosen.map(p=>p.id),(i,n)=>b.textContent=`Capturing pattern ${i} of ${n}…`); }
        catch(e){ shotsFailed=true; }
        if(!shotsFailed && Object.keys(images).length<chosen.length) shotsFailed=true;
      }
      b.textContent='Building PDF…';
      const doc=await buildPDF(chosen,images);
      const file=(draft.name||'ai-feature-draft').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase()+'-patterns.pdf';
      try{ doc.save(file); }catch(e){}
      const url=doc.output('bloburl');
      const framed = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
      note.innerHTML = framed
        ? `PDF created. If it didn't download, this preview is blocking downloads. Try <a href="${url}" target="_blank" rel="noopener" download="${file}">opening it in a new tab</a>, or open this file directly in your browser and download it from there.`
        : `PDF ready. If the download didn't start, <a href="${url}" target="_blank" rel="noopener" download="${file}">open it here</a>.`;
      if(shotsFailed) note.insertAdjacentHTML('beforeend',' Some pattern screenshots couldn\'t be captured, so those patterns appear as text only.');
    }catch(e){
      note.textContent='The PDF couldn\'t be created because the PDF library didn\'t load. Check your connection and try again, or use Copy as text.';
    }
    b.disabled=false; b.textContent='Download PDF';
  };
  $('#scopy').onclick=async()=>{
    const txt=summaryText(chosen);
    try{ await navigator.clipboard.writeText(txt); }
    catch{ const ta=document.createElement('textarea'); ta.value=txt; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    flash('Summary copied');
  };
  const sv=$('#ssave');
  const paintSave=()=>{ const dirty=isDirty(); sv.textContent = !dirty && draft.id ? '✓ Saved' : (draft.id ? 'Save changes' : 'Save draft'); sv.classList.toggle('done', !dirty && !!draft.id); };
  paintSave();
  sv.onclick=async()=>{
    if(!isDirty() && draft.id) return go('saved');
    sv.disabled=true; sv.textContent='Saving…';
    const r=await saveDraft(); sv.disabled=false;
    if(r==='error'){ flash('Couldn\'t save the draft. Try again.'); return paintSave(); }
    flash(r==='ok'?'Draft saved':'Saved for this session only'); render();
  };
  $('#sreset').onclick=()=>guardUnsaved($('#sreset'), newDraft, renderSummary);
}

/* ---------- Sheet ---------- */
let lastFocus=null;
function openSheet(id){
  const p=byId[id], s=$('#sheet'); lastFocus=lastFocus||document.activeElement;
  s.innerHTML=`<button class="close">Close</button>
    <div class="badge">${SURF[p.s]} · ${p.layer==='core'?'Core interaction':'Trust and control'}</div>
    <h2 id="sheetTitle">${p.name}</h2>
    <div class="stage" data-id="${p.id}"></div>
    <dl><dt>Use it when</dt><dd>${p.use}</dd>
    <dt>Avoid it when</dt><dd>${p.avoid}</dd>
    <dt>Pair it with</dt><dd class="links">${p.pairs.map(x=>`<button data-p="${x}">${byId[x].name}</button>`).join('')}</dd>
    <dt>Serves these capabilities</dt><dd class="links">${p.caps.map(c=>`<button data-c="${c}">${CAPS.find(x=>x.id===c).name}</button>`).join('')}</dd></dl>`;
  s.dataset.pid=id;
  if(state.mode==='review' || state.mode==='summary'){ $('.stage',s).insertAdjacentHTML('afterend',decideHTML(id)); wireDecide($('.decide',s),id); }
  const st=$('.stage',s); mountDemo(st,id); startDemo(st,id);
  $('.close',s).onclick=closeSheet;
  $$('[data-p]',s).forEach(b=>b.onclick=()=>openSheet(b.dataset.p));
  $$('[data-c]',s).forEach(b=>b.onclick=()=>{ state.cap=b.dataset.c; state.mode='browse'; closeSheet(); render(); window.scrollTo({top:0}); });
  s.classList.add('on'); $('#scrim').classList.add('on'); s.scrollTop=0; s.focus();
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); lastFocus&&lastFocus.focus&&lastFocus.focus(); lastFocus=null; }
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#sheet').classList.contains('on')) closeSheet(); });

$$('.seg button').forEach(b=>b.onclick=()=>{ state.surface=b.dataset.s; render(); });
readHash(); render(); loadSaved();
</script>
</body>
</html>
